name: Release APK

# 触发方式：
# 1. 推送 v 开头的 tag（如 v0.1.0）——发布正式 Release
# 2. Actions 页面手动触发并填写版本号——自动创建同名 tag 并发布
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（需以 v 开头，如 v0.1.0），会自动创建对应 tag'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            tag="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          # 版本名去掉 v 前缀；versionCode 用 workflow run number，保证每次发布递增
          name="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 等签名 Secrets，请在仓库 Settings → Secrets and variables → Actions 中添加"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks

      - name: Build signed release APK
        env:
          # 注意：Gradle 的 file() 在 app 模块内按模块目录解析，
          # jks 解码于 <root>/app/release.jks，故此处用模块相对路径
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # 发布前强制跑 lint + 单测，避免带病发版
          ./gradlew lintDebug testDebugUnitTest assembleRelease --stacktrace \
            -PversionCode=${{ steps.ver.outputs.code }} \
            -PversionName=${{ steps.ver.outputs.name }}

      - name: Verify signed APK
        run: |
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK with version
        # 资产名同样带 v 前缀：123AV-v0.1.1.apk
        run: cp app/build/outputs/apk/release/app-release.apk "123AV-${{ steps.ver.outputs.tag }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          # 发布标题与 tag 一致（v0.1.1），不再拼 "123AV 0.1.1"
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: 123AV-*.apk
