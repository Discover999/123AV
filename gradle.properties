# JVM 配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 显式指定运行 Gradle 的 JDK（Gradle 8.13 支持 Java 1.8~23，不支持本机 JBR/JDK 25）。
# 这是本机路径；换电脑时删除此行，改用 Android Studio 的 Gradle JDK 设置即可。
org.gradle.java.home=C:/Program Files/Microsoft/jdk-17.0.20.101-hotspot

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# 受限环境下 Kotlin 编译守护进程连接不稳定，使用进程内编译
kotlin.compiler.execution.strategy=in-process

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
